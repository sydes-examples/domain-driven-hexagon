name: Temp E2E Verification (calibration only)

# TEMPORARY, calibration-only workflow. Not part of the repo's normal CI.
# Added purely to obtain one real, observed test run for a preregistered
# Sydes calibration case, using a CI-only Postgres version override (the
# repo's docker-compose.yml pins the floating `postgres:alpine` tag, which
# now resolves to Postgres 18+ and is incompatible with local Docker
# Compose in some environments -- this workflow sidesteps that entirely by
# using a pinned, compatible Postgres version as a GitHub Actions service
# container instead of docker-compose). No application or test semantics
# are changed. This file is removed after use.

on:
  push:
    branches:
      - "ts-h-01-validate-postal-code-format-by-country"
      - "ts-m-01-forbid-deleting-protected-user"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ddh_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: user
      DB_PASSWORD: password
      DB_NAME: ddh_tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: NODE_ENV=test npm run migration:up:tests
      - run: npx jest -i --config jest-e2e.json tests/user/create-user tests/user/delete-user
